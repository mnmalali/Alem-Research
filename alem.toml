[alem]
workspace_version = 1
name = "Alem Research"
tagline = "Your research. Your knowledge. Your AI research workspace."

[runtime]
state_directory = ".alem/state"
cache_directory = ".alem/cache"
log_directory = ".alem/logs"
plugin_directory = ".alem/plugins"
plugin_environment_directory = ".alem/venvs"

[plugins]
api_version = "1.0"
catalogues = ["catalogue/index.toml"]
require_install_approval = true
require_execution_approval = true

[context]
mode = "lazy"
max_skills = 5
max_capabilities = 6
max_context_tokens = 12000
allow_expansion = true

[capabilities.academic_search]
default = "org.alem.openalex"
fallbacks = ["org.alem.semantic-scholar"]

[capabilities.model_completion]
default = "org.alem.model-gateway"

[agents]
canonical_skills = "skills"
codex_skills = ".agents/skills"
claude_skills = ".claude/skills"

[privacy]
telemetry = false
local_first = true
