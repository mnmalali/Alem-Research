name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Clean launcher bootstrap smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\alem.ps1 setup --create-venv
          .\alem.ps1 health --strict
          .\alem.ps1 --help
      - name: Clean launcher bootstrap smoke (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh ./alem setup --create-venv
          ./alem health --strict
          ./alem --help
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest
      - run: alem integration validate
